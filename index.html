<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개인 스케줄</title>
<style>
  :root {
    --bg: #faf6ee;
    --card: #fffdf8;
    --text: #362f22;
    --sub: #8a8270;
    --border: #e6ddc9;
    --accent: #6a8f5c;
    --accent-light: #eaf0e2;
    --task: #eab308;
    --task-light: #fdf6d8;
    --vacation: #e08b7d;
    --vacation-light: #f9e4e0;
    --danger: #bb5b3d;
    --holiday: #dc2626;
    --saturday: #3b6ea5;
    --mine: #6a8f5c;
    --mine-light: #eaf0e2;
    --ref-green: #b3d98c;
    --done: #a9a08a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1e17;
      --card: #262820;
      --text: #f2eee2;
      --sub: #b3ab97;
      --border: #3a3c31;
      --accent: #8bbb78;
      --accent-light: #2a3324;
      --task: #fbbf24;
      --task-light: #40350f;
      --vacation: #e8a89c;
      --vacation-light: #3d2620;
      --danger: #e08363;
      --holiday: #f87171;
      --saturday: #7fa8d9;
      --mine: #8bbb78;
      --mine-light: #2a3324;
      --ref-green: #c3e2a0;
      --done: #7c775f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 20px 16px 80px; }
  .main-layout { display: flex; gap: 28px; align-items: flex-start; }
  .quick-col { flex: 0 0 260px; min-width: 220px; position: sticky; top: 20px; }
  .left-col { flex: 1 1 700px; min-width: 0; }
  .side-col { flex: 0 0 320px; min-width: 280px; position: sticky; top: 20px; }
  @media (max-width: 1100px) {
    .main-layout { flex-direction: column; }
    .quick-col, .side-col { flex: 1 1 auto; width: 100%; position: static; }
  }
  h1 { font-size: 20px; margin: 8px 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .hidden { display: none !important; }
  label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
  }
  textarea { resize: vertical; min-height: 50px; }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: white; width: 100%; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--sub); font-weight: 400; padding: 6px 10px; }
  .btn-danger-text { background: transparent; color: var(--danger); font-weight: 400; padding: 6px 10px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .date-row { margin-bottom: 4px; }
  .date-field { flex: 1; min-width: 0; }
  input[readonly] { cursor: pointer; background: var(--accent-light); }
  .range-hint { font-size: 12px; color: var(--accent); margin: -2px 0 12px; }
  .range-hint.hidden { display: none; }
  .top-bar { display: flex; justify-content: space-between; align-items: baseline; }
  .status { font-size: 12px; color: var(--sub); min-height: 16px; margin-top: 4px; }
  .status.error { color: var(--danger); }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .type-toggle button {
    flex: 1; background: var(--bg); color: var(--sub); border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px;
  }
  .type-toggle button.active { background: var(--mine-light); color: var(--mine); border-color: var(--mine); }
  #typeTaskBtn.active { background: var(--task-light); color: var(--task); border-color: var(--task); }
  #typeVacationBtn.active { background: var(--vacation-light); color: var(--vacation); border-color: var(--vacation); }
  .type-sub { font-size: 11px; font-weight: 400; opacity: 0.75; }
  .attend-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .attend-toggle.hidden { display: none; }
  .attend-toggle button {
    flex: 1; background: var(--bg); color: var(--sub); border: 1px solid var(--border);
    padding: 8px 6px; font-size: 13px;
  }
  .attend-toggle button.active { background: var(--mine-light); color: var(--mine); border-color: var(--mine); }
  #attendRefBtn.active { background: var(--bg); color: var(--text); border-color: var(--sub); }

  /* 작성란(side-col)만 확대 */
  .side-col.card { padding: 22px; }
  .side-col label { font-size: 15px; margin-bottom: 6px; }
  .side-col input, .side-col textarea {
    font-size: 16px; padding: 13px 15px; margin-bottom: 15px; border-radius: 10px;
  }
  .side-col textarea { min-height: 70px; }
  .side-col #titleInput { padding: 17px 16px; font-size: 18px; }
  .side-col #memoInput { min-height: 160px; font-size: 17px; padding: 16px; }
  .side-col .type-toggle button { padding: 14px 8px; font-size: 16px; }
  .side-col .type-sub { font-size: 12px; }
  .side-col button.btn-primary { font-size: 17px; padding: 14px 20px; }
  .badge.badge-task { background: var(--task-light); color: var(--task); }
  .badge.badge-vacation { background: var(--vacation-light); color: var(--vacation); }
  .badge.badge-ref { background: var(--bg); color: var(--sub); border: 1px solid var(--border); }
  .item.ref-only { border-style: dashed; }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .cal-title { font-weight: 700; font-size: 20px; }
  .cal-header button { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; font-size: 16px; }
  .cal-grid-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); }
  .cal-dow { text-align: center; font-size: 13px; color: var(--sub); padding: 6px 0; background: var(--card); }
  .cal-dow.sun { color: var(--danger); }
  .cal-dow.sat { color: var(--saturday); }
  .cal-day {
    position: relative; aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: stretch; justify-content: flex-start; padding: 7px 8px; font-size: 17px; background: var(--card);
    cursor: pointer; border: 2px solid transparent;
  }
  .cal-day:hover { background: var(--accent-light); }
  .cal-day.other-month { color: var(--sub); opacity: 0.5; }
  .cal-day.today { border-color: var(--accent); font-weight: 700; z-index: 1; }
  .cal-day.selected { background: var(--accent); color: #fff; }
  .cal-day.selected:hover { background: var(--accent); }
  .cal-day.vacation { background: var(--vacation-light); }
  .cal-day.vacation.selected { background: var(--vacation); color: #fff; }
  .cal-day.sat:not(.other-month):not(.selected) { color: var(--saturday); }
  .cal-day.sun:not(.other-month):not(.selected) { color: var(--danger); }
  .cal-day.holiday:not(.other-month):not(.selected) { color: var(--holiday); }
  .cal-day.holiday.selected { color: #fff; }
  .cal-day-top { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .cal-daynum { flex-shrink: 0; }
  .cal-holiday {
    font-size: 9px; font-weight: 300; color: var(--holiday); line-height: 1.1;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cal-day.selected .cal-holiday { color: #fff; }
  .cal-vacation-tag {
    font-size: 9px; font-weight: 300; color: var(--vacation); line-height: 1.1;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cal-day.selected .cal-vacation-tag { color: #fff; }
  .cal-bars { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
  .cal-bar { height: 7px; background: var(--mine); margin: 0 -8px; }
  .cal-bar.bar-start { margin-left: 0; border-radius: 999px 0 0 999px; }
  .cal-bar.bar-end { margin-right: 0; border-radius: 0 999px 999px 0; }
  .cal-bar.bar-start.bar-end { margin: 0; border-radius: 999px; }
  .cal-bar.ref { opacity: 0.45; }
  .cal-day.selected .cal-bar { background: #fff; }
  .cal-dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .cal-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mine); }
  .cal-dot.task { background: var(--task); }
  .cal-dot.ref { background: var(--ref-green); }
  .cal-day.selected .cal-dot { background: #fff; }
  .cal-dot.dot-active { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--danger); }
  .cal-day.selected .cal-dot.dot-active { box-shadow: 0 0 0 2px var(--accent), 0 0 0 4px #fff; }
  .list-filter-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin: 4px 4px 12px; font-size: 13px; color: var(--sub);
  }
  .list-filter-bar.hidden { display: none; }
  .list-filter-bar b { color: var(--text); }
  .group-label { font-size: 13px; color: var(--sub); margin: 20px 0 8px; font-weight: 600; }
  .item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); margin-bottom: 8px;
  }
  .item.done { opacity: 0.55; }
  .item.overdue .item-date { color: var(--danger); }
  .item input[type=checkbox] { margin-top: 3px; width: 18px; height: 18px; }
  .item-body { flex: 1; min-width: 0; }
  .item-title { font-size: 14px; font-weight: 600; word-break: break-word; }
  .item.done .item-title { text-decoration: line-through; color: var(--done); }
  .item-date { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .item-memo { font-size: 13px; color: var(--sub); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .item-actions { display: flex; flex-direction: column; gap: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--mine-light); color: var(--mine); margin-left: 6px; }
  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 30px 0; }
  a { color: var(--accent); }
  .token-help { font-size: 12px; color: var(--sub); line-height: 1.6; margin-top: 8px; }
  .token-help ol { padding-left: 18px; margin: 6px 0; }
  .footer-link { text-align: center; margin-top: 24px; }
  .footer-link button { font-size: 12px; }

  .quick-title { font-size: 15px; margin: 0 0 12px; }
  .quick-input-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .quick-input-row input { margin-bottom: 0; font-size: 14px; padding: 18px 12px; width: 100%; }
  .quick-input-row textarea { margin-bottom: 0; font-size: 13px; padding: 10px 12px; width: 100%; min-height: 54px; }
  .quick-input-row button { padding: 9px 14px; font-size: 13px; }
  .quick-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 4px; border-bottom: 1px solid var(--border);
  }
  .quick-item:last-child { border-bottom: none; }
  .quick-item input[type=checkbox] { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; }
  .quick-item-body { flex: 1; min-width: 0; }
  .quick-item-title { font-size: 13px; word-break: break-word; }
  .quick-item.done .quick-item-title { text-decoration: line-through; color: var(--done); }
  .quick-item-memo { font-size: 12px; color: var(--sub); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .quick-item .btn-danger-text { padding: 0 0 0 4px; font-size: 12px; flex-shrink: 0; }
  .quick-empty { font-size: 12px; color: var(--sub); text-align: center; padding: 10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>📅 개인 스케줄</h1>
  </div>

  <!-- 토큰 입력 화면 -->
  <div id="authScreen" class="card hidden">
    <label for="tokenInput">GitHub Personal Access Token</label>
    <input id="tokenInput" type="password" placeholder="github_pat_... 또는 ghp_...">
    <button class="btn-primary" id="saveTokenBtn">연결하기</button>
    <div class="status" id="authStatus"></div>
    <div class="token-help">
      토큰이 없다면:
      <ol>
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank">Fine-grained token 발급 페이지</a> 열기</li>
        <li>Repository access → <b>Only select repositories</b> → <b>personal-schedule</b> 선택</li>
        <li>Permissions → <b>Contents</b> → <b>Read and write</b> 선택</li>
        <li>Generate token 클릭 후, 생성된 토큰(<code>github_pat_...</code>)을 위 입력창에 붙여넣기</li>
      </ol>
      토큰은 이 브라우저에만 저장되며 외부로 전송되지 않습니다(GitHub API 호출에만 사용).
    </div>
  </div>

  <!-- 메인 화면 -->
  <div id="mainScreen" class="hidden">
    <div class="main-layout">
      <div class="quick-col card">
        <h2 class="quick-title">📋 빠른 할일</h2>
        <div class="quick-input-row">
          <input id="quickInput" type="text" placeholder="날짜 없는 할일 입력">
          <textarea id="quickMemoInput" placeholder="메모 (선택)"></textarea>
          <button class="btn-primary" id="quickAddBtn">추가</button>
        </div>
        <div id="quickList"></div>
      </div>

      <div class="left-col">
        <div class="calendar-col card">
          <div class="cal-header">
            <button type="button" id="calPrevBtn">‹</button>
            <div class="cal-title" id="calTitle"></div>
            <button type="button" id="calNextBtn">›</button>
          </div>
          <div class="cal-grid-wrap"><div class="cal-grid" id="calGrid"></div></div>
        </div>

        <div class="list-filter-bar hidden" id="listFilterBar">
          <span id="listFilterLabel"></span>
          <button class="btn-ghost" id="clearFilterBtn">전체보기</button>
        </div>
        <div id="listContainer"></div>

        <div class="footer-link">
          <button class="btn-ghost" id="refreshBtn">🔄 새로고침</button>
          <button class="btn-ghost" id="logoutBtn">토큰 지우기</button>
        </div>
      </div>

      <div class="side-col card">
        <div class="type-toggle">
          <button type="button" id="typeEventBtn" class="active">
            📌 일정<span class="type-sub">회의·행사</span>
          </button>
          <button type="button" id="typeTaskBtn">
            ✅ 할일<span class="type-sub">마감일 있는 작업</span>
          </button>
          <button type="button" id="typeVacationBtn">
            🏖 휴가<span class="type-sub">연차·휴일</span>
          </button>
        </div>
        <div class="attend-toggle" id="attendToggle">
          <button type="button" id="attendMeBtn" class="active" data-val="true">🙋 내 일정</button>
          <button type="button" id="attendRefBtn" data-val="false">📋 참고용</button>
        </div>
        <div class="row date-row">
          <div class="date-field">
            <label for="dateInput" id="dateLabel">날짜</label>
            <input id="dateInput" type="date">
          </div>
          <div class="date-field hidden" id="endDateGroup">
            <label for="endDateInput">종료일</label>
            <input id="endDateInput" type="date">
          </div>
        </div>
        <div class="row date-row hidden" id="timeGroup">
          <div class="date-field">
            <label for="startTimeInput">시작 시간</label>
            <input id="startTimeInput" type="time">
          </div>
          <div class="date-field">
            <label for="endTimeInput">종료 시간</label>
            <input id="endTimeInput" type="time">
          </div>
        </div>
        <label for="titleInput">제목</label>
        <input id="titleInput" type="text" placeholder="예: 워크숍 준비">
        <label for="memoInput">메모 (선택)</label>
        <textarea id="memoInput" placeholder="세부 내용"></textarea>
        <div class="row">
          <button class="btn-primary" id="addBtn">추가하기</button>
          <button class="btn-ghost hidden" id="cancelEditBtn" style="flex:0 0 auto;">취소</button>
        </div>
        <div class="status" id="mainStatus"></div>
      </div>
    </div>
  </div>
</div>

<script>
const OWNER = "hyerans0402-svg";
const REPO = "personal-schedule";
const PATH = "data.json";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;

let token = localStorage.getItem("gh_pat") || "";
let currentSha = null;
let items = [];
let currentType = "event";
let currentAttending = true; // true = 내 일정(직접 참여), false = 참고용(상급자 일정 등)
let viewYear, viewMonth; // viewMonth is 0-indexed
let selectedDate = null; // "YYYY-MM-DD" or null (null = show full chronological list)
let selectedVariant = null; // "task" | "event-mine" | "event-ref" | null (dot-click sub-filter within selectedDate)
let editingId = null; // id of item currently being edited, or null

// 대한민국 법정공휴일 2026 (출처: 한국천문연구원 특일 정보 기준)
const KR_HOLIDAYS = {
  "2026-01-01": "신정",
  "2026-02-16": "설날연휴",
  "2026-02-17": "설날",
  "2026-02-18": "설날연휴",
  "2026-03-01": "삼일절",
  "2026-03-02": "대체공휴일",
  "2026-05-05": "어린이날",
  "2026-05-24": "부처님오신날",
  "2026-05-25": "대체공휴일",
  "2026-06-06": "현충일",
  "2026-08-15": "광복절",
  "2026-08-17": "대체공휴일",
  "2026-09-24": "추석연휴",
  "2026-09-25": "추석",
  "2026-09-26": "추석연휴",
  "2026-10-03": "개천절",
  "2026-10-05": "대체공휴일",
  "2026-10-09": "한글날",
  "2026-12-25": "성탄절"
};

const authScreen = document.getElementById("authScreen");
const mainScreen = document.getElementById("mainScreen");
const authStatus = document.getElementById("authStatus");
const mainStatus = document.getElementById("mainStatus");
const listContainer = document.getElementById("listContainer");

function b64EncodeUnicode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
    (_, p1) => String.fromCharCode('0x' + p1)));
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split('').map(c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

async function ghRequest(method, body) {
  const res = await fetch(API, {
    method,
    headers: {
      "Authorization": `Bearer ${token}`,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : undefined
  });
  return res;
}

async function loadData() {
  mainStatus.textContent = "불러오는 중...";
  mainStatus.className = "status";
  try {
    const res = await ghRequest("GET");
    if (res.status === 404) {
      items = [];
      currentSha = null;
      mainStatus.textContent = "";
      renderAll();
      return true;
    }
    if (!res.ok) throw new Error(`GitHub 응답 오류 (${res.status})`);
    const json = await res.json();
    currentSha = json.sha;
    items = JSON.parse(b64DecodeUnicode(json.content) || "[]");
    mainStatus.textContent = "";
    renderAll();
    return true;
  } catch (e) {
    mainStatus.textContent = "불러오기 실패: " + e.message;
    mainStatus.className = "status error";
    return false;
  }
}

async function saveData() {
  mainStatus.textContent = "저장 중...";
  mainStatus.className = "status";
  try {
    const body = {
      message: "update schedule",
      content: b64EncodeUnicode(JSON.stringify(items, null, 2)),
    };
    if (currentSha) body.sha = currentSha;
    const res = await ghRequest("PUT", body);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `저장 오류 (${res.status})`);
    }
    const json = await res.json();
    currentSha = json.content.sha;
    mainStatus.textContent = "저장됨";
    setTimeout(() => { if (mainStatus.textContent === "저장됨") mainStatus.textContent = ""; }, 1500);
  } catch (e) {
    mainStatus.textContent = "저장 실패: " + e.message + " (새로고침 후 다시 시도해주세요)";
    mainStatus.className = "status error";
    await loadData();
  }
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function renderAll() {
  renderCalendar();
  renderList();
  renderQuickTodos();
}

function pad2(n) { return String(n).padStart(2, "0"); }

function dateKey(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }

function dateRange(startStr, endStr) {
  const out = [];
  const start = new Date(startStr + "T00:00:00");
  const end = new Date(endStr + "T00:00:00");
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    out.push(dateKey(d.getFullYear(), d.getMonth(), d.getDate()));
  }
  return out;
}

function supportsDateRange(type) {
  return type === "event" || type === "vacation";
}

function itemSpan(it) {
  return (supportsDateRange(it.type) && it.endDate && it.endDate > it.date) ? it.endDate : it.date;
}

function renderCalendar() {
  document.getElementById("calTitle").textContent = `${viewYear}년 ${viewMonth + 1}월`;
  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  ["일", "월", "화", "수", "목", "금", "토"].forEach((d, i) => {
    const el = document.createElement("div");
    el.className = "cal-dow" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
    el.textContent = d;
    grid.appendChild(el);
  });

  const itemsByDate = {};
  items.forEach(it => {
    if (it.type === "quicktask") return;
    const endStr = itemSpan(it);
    const days = endStr > it.date ? dateRange(it.date, endStr) : [it.date];
    days.forEach(dStr => {
      (itemsByDate[dStr] = itemsByDate[dStr] || []).push(it);
    });
  });

  const startOffset = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const today = todayStr();
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startOffset + 1;
    let y = viewYear, m = viewMonth, d, otherMonth = false;
    if (dayNum < 1) { d = daysInPrevMonth + dayNum; m -= 1; otherMonth = true; }
    else if (dayNum > daysInMonth) { d = dayNum - daysInMonth; m += 1; otherMonth = true; }
    else { d = dayNum; }
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    const dStr = dateKey(y, m, d);

    const holidayName = KR_HOLIDAYS[dStr];
    const dayItems = itemsByDate[dStr];
    const isVacation = !!(dayItems && dayItems.some(x => x.type === "vacation"));
    const dow = i % 7; // grid columns always run 일~토, so column index == day-of-week
    const cell = document.createElement("div");
    cell.className = "cal-day"
      + (otherMonth ? " other-month" : "")
      + (dStr === today ? " today" : "")
      + (dStr === selectedDate ? " selected" : "")
      + (holidayName ? " holiday" : "")
      + (isVacation ? " vacation" : "")
      + (dow === 0 ? " sun" : dow === 6 ? " sat" : "");

    const top = document.createElement("div");
    top.className = "cal-day-top";
    const num = document.createElement("span");
    num.className = "cal-daynum";
    num.textContent = d;
    top.appendChild(num);

    if (holidayName) {
      const hEl = document.createElement("span");
      hEl.className = "cal-holiday";
      hEl.textContent = holidayName;
      top.appendChild(hEl);
    }
    if (isVacation) {
      const vEl = document.createElement("span");
      vEl.className = "cal-vacation-tag";
      vEl.textContent = "휴가";
      top.appendChild(vEl);
    }
    cell.appendChild(top);

    if (dayItems && dayItems.length) {
      const multiDay = dayItems.filter(x => x.type === "event" && x.endDate && x.endDate > x.date);
      const singleDay = dayItems.filter(x => !(x.type === "event" && x.endDate && x.endDate > x.date));

      if (multiDay.length) {
        const bars = document.createElement("div");
        bars.className = "cal-bars";
        multiDay.forEach(it => {
          const bar = document.createElement("div");
          const isStart = (dStr === it.date) || (dow === 0);
          const isEnd = (dStr === itemSpan(it)) || (dow === 6);
          bar.className = "cal-bar"
            + (isStart ? " bar-start" : "")
            + (isEnd ? " bar-end" : "")
            + (it.attending === false ? " ref" : "");
          bars.appendChild(bar);
        });
        cell.appendChild(bars);
      }

      const dotItems = singleDay.filter(x => x.type !== "vacation");
      if (dotItems.length) {
        const dots = document.createElement("div");
        dots.className = "cal-dots";
        dotItems.forEach(x => {
          const v = x.type === "event" ? (x.attending === false ? "event-ref" : "event-mine") : x.type;
          const dot = document.createElement("span");
          const isActiveVariant = dStr === selectedDate && v === selectedVariant;
          dot.className = "cal-dot"
            + (v === "task" ? " task" : v === "event-ref" ? " ref" : "")
            + (isActiveVariant ? " dot-active" : "");
          dot.addEventListener("click", (e) => {
            e.stopPropagation();
            selectDate(dStr, v);
          });
          dots.appendChild(dot);
        });
        cell.appendChild(dots);
      }
    }
    cell.addEventListener("click", () => selectDate(dStr));
    grid.appendChild(cell);
  }
}

function selectDate(dStr, variant = null) {
  if (variant) {
    if (selectedDate === dStr && selectedVariant === variant) {
      selectedDate = null; selectedVariant = null;
    } else {
      selectedDate = dStr; selectedVariant = variant;
    }
  } else {
    selectedDate = (selectedDate === dStr) ? null : dStr;
    selectedVariant = null;
  }
  const [y, m] = dStr.split("-").map(Number);
  viewYear = y; viewMonth = m - 1;
  document.getElementById("dateInput").value = dStr;
  if (supportsDateRange(currentType)) {
    const endInput = document.getElementById("endDateInput");
    if (!endInput.value || endInput.value < dStr) endInput.value = dStr;
  }
  renderAll();
}

function matchesVariant(it, variant) {
  if (!variant) return true;
  if (variant === "task") return it.type === "task";
  if (variant === "event-ref") return it.type === "event" && it.attending === false;
  if (variant === "event-mine") return it.type === "event" && it.attending !== false;
  return true;
}

function shiftMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
}

function renderList() {
  const filterBar = document.getElementById("listFilterBar");
  const filterLabel = document.getElementById("listFilterLabel");
  const today = todayStr();
  let sorted;

  const VARIANT_LABELS = { task: "할일만", "event-mine": "일정만", "event-ref": "참고용만" };
  const scheduled = items.filter(it => it.type !== "quicktask");
  if (selectedDate) {
    filterBar.classList.remove("hidden");
    const variantSuffix = selectedVariant ? ` · ${VARIANT_LABELS[selectedVariant]}` : "";
    filterLabel.innerHTML = `<b>${formatDateLabel(selectedDate, today)}${variantSuffix}</b>`;
    sorted = scheduled.filter(it =>
      it.date <= selectedDate && itemSpan(it) >= selectedDate && matchesVariant(it, selectedVariant)
    );
  } else {
    filterBar.classList.add("hidden");
    // 전체보기에서는 지난 참고용 일정, 완료된 할일은 숨겨서 남은 것만 보이게 함
    sorted = scheduled
      .filter(it => {
        if (it.type === "task" && it.done) return false;
        if (it.type === "event" && it.attending === false && it.date < today) return false;
        return true;
      })
      .sort((a, b) => a.date.localeCompare(b.date));
  }

  listContainer.innerHTML = "";
  if (sorted.length === 0) {
    listContainer.innerHTML = '<div class="empty">등록된 일정이 없습니다</div>';
    return;
  }
  let lastDate = null;
  sorted.forEach(it => {
    if (!selectedDate && it.date !== lastDate) {
      const label = document.createElement("div");
      label.className = "group-label";
      label.textContent = formatDateLabel(it.date, today);
      listContainer.appendChild(label);
      lastDate = it.date;
    }
    listContainer.appendChild(renderItem(it, today));
  });
}

function formatDateLabel(dateStr, today) {
  const diffDays = Math.round((new Date(dateStr) - new Date(today)) / 86400000);
  let rel = "";
  if (diffDays === 0) rel = " · 오늘";
  else if (diffDays === 1) rel = " · 내일";
  else if (diffDays === -1) rel = " · 어제";
  else if (diffDays < 0) rel = ` · ${-diffDays}일 지남`;
  else rel = ` · ${diffDays}일 후`;
  return dateStr + rel;
}

function dDayText(dateStr, today) {
  const diffDays = Math.round((new Date(dateStr) - new Date(today)) / 86400000);
  if (diffDays === 0) return "오늘 마감";
  if (diffDays === 1) return "내일 마감";
  if (diffDays < 0) return `마감 ${-diffDays}일 지남`;
  return `마감까지 ${diffDays}일`;
}

function formatTimeRange(it) {
  if (!it.startTime && !it.endTime) return "";
  if (it.startTime && it.endTime) return `${it.startTime}~${it.endTime}`;
  return it.startTime || it.endTime;
}

function renderItem(it, today) {
  const div = document.createElement("div");
  const overdue = it.type === "task" && !it.done && it.date < today;
  const isRef = it.type === "event" && it.attending === false;
  div.className = "item" + (it.done ? " done" : "") + (overdue ? " overdue" : "") + (isRef ? " ref-only" : "");

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = !!it.done;
  if (it.type !== "task") checkbox.style.visibility = "hidden";
  checkbox.addEventListener("change", () => toggleDone(it.id));

  const body = document.createElement("div");
  body.className = "item-body";
  const title = document.createElement("div");
  title.className = "item-title";
  title.textContent = it.title;
  const badge = document.createElement("span");
  if (it.type === "event" && it.attending === false) {
    badge.className = "badge badge-ref";
    badge.textContent = "참고";
  } else if (it.type === "event") {
    badge.className = "badge";
    badge.textContent = "일정";
  } else if (it.type === "task") {
    badge.className = "badge badge-task";
    badge.textContent = "할일";
  } else {
    badge.className = "badge badge-vacation";
    badge.textContent = "휴가";
  }
  title.appendChild(badge);
  body.appendChild(title);
  if (supportsDateRange(it.type)) {
    const isMultiDay = it.endDate && it.endDate > it.date;
    const timeText = formatTimeRange(it);
    if (isMultiDay || timeText) {
      const rangeEl = document.createElement("div");
      rangeEl.className = "item-date";
      rangeEl.textContent = [
        isMultiDay ? `${it.date} ~ ${it.endDate}` : "",
        timeText
      ].filter(Boolean).join(" · ");
      body.appendChild(rangeEl);
    }
  }
  if (it.type === "task" && !it.done) {
    const ddayEl = document.createElement("div");
    ddayEl.className = "item-date";
    ddayEl.textContent = dDayText(it.date, today);
    body.appendChild(ddayEl);
  }
  if (it.memo) {
    const memo = document.createElement("div");
    memo.className = "item-memo";
    memo.textContent = it.memo;
    body.appendChild(memo);
  }

  const actions = document.createElement("div");
  actions.className = "item-actions";
  const editBtn = document.createElement("button");
  editBtn.className = "btn-ghost";
  editBtn.textContent = "수정";
  editBtn.addEventListener("click", () => startEdit(it.id));
  actions.appendChild(editBtn);
  const delBtn = document.createElement("button");
  delBtn.className = "btn-danger-text";
  delBtn.textContent = "삭제";
  delBtn.addEventListener("click", () => deleteItem(it.id));
  actions.appendChild(delBtn);

  div.appendChild(checkbox);
  div.appendChild(body);
  div.appendChild(actions);
  return div;
}

async function toggleDone(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  it.done = !it.done;
  renderAll();
  await saveData();
}

async function deleteItem(id) {
  items = items.filter(i => i.id !== id);
  renderAll();
  await saveData();
}

function renderQuickTodos() {
  const list = document.getElementById("quickList");
  const todos = items.filter(it => it.type === "quicktask");
  // 미완료 먼저(오래된 순으로 쌓임), 완료된 건 아래로
  todos.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return a.createdAt.localeCompare(b.createdAt);
  });
  list.innerHTML = "";
  if (todos.length === 0) {
    list.innerHTML = '<div class="quick-empty">아직 없어요</div>';
    return;
  }
  todos.forEach(it => {
    const row = document.createElement("div");
    row.className = "quick-item" + (it.done ? " done" : "");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !!it.done;
    checkbox.addEventListener("change", () => toggleDone(it.id));
    const body = document.createElement("div");
    body.className = "quick-item-body";
    const title = document.createElement("div");
    title.className = "quick-item-title";
    title.textContent = it.title;
    body.appendChild(title);
    if (it.memo) {
      const memo = document.createElement("div");
      memo.className = "quick-item-memo";
      memo.textContent = it.memo;
      body.appendChild(memo);
    }
    const delBtn = document.createElement("button");
    delBtn.className = "btn-danger-text";
    delBtn.textContent = "✕";
    delBtn.addEventListener("click", () => deleteItem(it.id));
    row.appendChild(checkbox);
    row.appendChild(body);
    row.appendChild(delBtn);
    list.appendChild(row);
  });
}

async function addQuickTodo() {
  const input = document.getElementById("quickInput");
  const memoInput = document.getElementById("quickMemoInput");
  const title = input.value.trim();
  const memo = memoInput.value.trim();
  if (!title) return;
  items.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    type: "quicktask", title, memo, date: "", done: false,
    createdAt: new Date().toISOString()
  });
  input.value = "";
  memoInput.value = "";
  renderQuickTodos();
  await saveData();
}

document.getElementById("quickAddBtn").addEventListener("click", addQuickTodo);
document.getElementById("quickInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") addQuickTodo();
});

const TYPE_CONFIG = {
  event: {
    dateLabel: "시작일",
    titlePlaceholder: "예: 전문가 자문회의, 연구단 워크숍",
    memoPlaceholder: "장소, 참석자 등"
  },
  task: {
    dateLabel: "마감일",
    titlePlaceholder: "예: 보고서 작성, 제안서 제출, 강사 계약",
    memoPlaceholder: "세부 내용, 담당자 등"
  },
  vacation: {
    dateLabel: "시작일",
    titlePlaceholder: "예: 여름휴가, 연차",
    memoPlaceholder: "메모 (선택)"
  }
};

function applyTypeConfig(type) {
  const cfg = TYPE_CONFIG[type];
  document.getElementById("dateLabel").textContent = cfg.dateLabel;
  document.getElementById("titleInput").placeholder = cfg.titlePlaceholder;
  document.getElementById("memoInput").placeholder = cfg.memoPlaceholder;
}

function setFormType(type) {
  currentType = type;
  document.getElementById("typeEventBtn").classList.toggle("active", type === "event");
  document.getElementById("typeTaskBtn").classList.toggle("active", type === "task");
  document.getElementById("typeVacationBtn").classList.toggle("active", type === "vacation");
  document.getElementById("attendToggle").classList.toggle("hidden", type !== "event");
  document.getElementById("endDateGroup").classList.toggle("hidden", !supportsDateRange(type));
  document.getElementById("timeGroup").classList.toggle("hidden", type !== "event");
  const dateInputEl = document.getElementById("dateInput");
  const endInput = document.getElementById("endDateInput");
  if (supportsDateRange(type)) {
    if (!endInput.value) endInput.value = dateInputEl.value;
  }
  applyTypeConfig(type);
}

function setAttending(val) {
  currentAttending = val;
  document.getElementById("attendMeBtn").classList.toggle("active", val === true);
  document.getElementById("attendRefBtn").classList.toggle("active", val === false);
}

document.getElementById("typeEventBtn").addEventListener("click", () => setFormType("event"));
document.getElementById("typeTaskBtn").addEventListener("click", () => setFormType("task"));
document.getElementById("typeVacationBtn").addEventListener("click", () => setFormType("vacation"));
document.getElementById("attendMeBtn").addEventListener("click", () => setAttending(true));
document.getElementById("attendRefBtn").addEventListener("click", () => setAttending(false));

document.getElementById("dateInput").addEventListener("change", () => {
  const start = document.getElementById("dateInput").value;
  const endInput = document.getElementById("endDateInput");
  if (!supportsDateRange(currentType)) return;
  if (!endInput.value || endInput.value < start) {
    endInput.value = start;
  }
});

function startEdit(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  editingId = id;
  document.getElementById("dateInput").value = it.date;
  document.getElementById("endDateInput").value = it.endDate || it.date;
  document.getElementById("startTimeInput").value = it.startTime || "";
  document.getElementById("endTimeInput").value = it.endTime || "";
  setFormType(it.type);
  if (it.type === "event") setAttending(it.attending !== false);
  document.getElementById("titleInput").value = it.title;
  document.getElementById("memoInput").value = it.memo || "";
  document.getElementById("addBtn").textContent = "수정 완료";
  document.getElementById("cancelEditBtn").classList.remove("hidden");
  document.querySelector(".side-col").scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetForm() {
  editingId = null;
  document.getElementById("titleInput").value = "";
  document.getElementById("memoInput").value = "";
  document.getElementById("dateInput").value = todayStr();
  document.getElementById("endDateInput").value = todayStr();
  document.getElementById("startTimeInput").value = "";
  document.getElementById("endTimeInput").value = "";
  document.getElementById("addBtn").textContent = "추가하기";
  document.getElementById("cancelEditBtn").classList.add("hidden");
  setFormType("event");
  setAttending(true);
}

document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

document.getElementById("addBtn").addEventListener("click", async () => {
  const date = document.getElementById("dateInput").value;
  const title = document.getElementById("titleInput").value.trim();
  const memo = document.getElementById("memoInput").value.trim();
  if (!date || !title) {
    mainStatus.textContent = "날짜와 제목을 입력해주세요";
    mainStatus.className = "status error";
    return;
  }
  let endDate = date;
  if (supportsDateRange(currentType)) {
    endDate = document.getElementById("endDateInput").value || date;
    if (endDate < date) {
      mainStatus.textContent = "종료일은 시작일보다 빠를 수 없어요";
      mainStatus.className = "status error";
      return;
    }
  }
  const attending = currentType === "event" ? currentAttending : true;
  const startTime = currentType === "event" ? document.getElementById("startTimeInput").value : "";
  const endTime = currentType === "event" ? document.getElementById("endTimeInput").value : "";
  if (editingId) {
    const it = items.find(i => i.id === editingId);
    if (it) {
      it.date = date; it.title = title; it.memo = memo; it.type = currentType;
      it.attending = attending;
      if (supportsDateRange(currentType)) it.endDate = endDate; else delete it.endDate;
      if (currentType === "event") {
        it.startTime = startTime; it.endTime = endTime;
      } else {
        delete it.startTime; delete it.endTime;
      }
    }
  } else {
    const newItem = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date, title, memo, type: currentType, done: false, attending,
      createdAt: new Date().toISOString()
    };
    if (supportsDateRange(currentType)) newItem.endDate = endDate;
    if (currentType === "event") {
      newItem.startTime = startTime; newItem.endTime = endTime;
    }
    items.push(newItem);
  }
  resetForm();
  renderAll();
  await saveData();
});

document.getElementById("calPrevBtn").addEventListener("click", () => shiftMonth(-1));
document.getElementById("calNextBtn").addEventListener("click", () => shiftMonth(1));
document.getElementById("clearFilterBtn").addEventListener("click", () => {
  selectedDate = null;
  selectedVariant = null;
  renderAll();
});

document.getElementById("refreshBtn").addEventListener("click", loadData);

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("gh_pat");
  token = "";
  mainScreen.classList.add("hidden");
  authScreen.classList.remove("hidden");
});

document.getElementById("saveTokenBtn").addEventListener("click", async () => {
  const val = document.getElementById("tokenInput").value.trim();
  if (!val) return;
  token = val;
  authStatus.textContent = "확인 중...";
  authStatus.className = "status";
  const ok = await loadData();
  if (ok) {
    localStorage.setItem("gh_pat", token);
    authScreen.classList.add("hidden");
    mainScreen.classList.remove("hidden");
    document.getElementById("dateInput").value = todayStr();
  } else {
    authStatus.textContent = "연결 실패: 토큰 권한(personal-schedule 저장소, Contents Read/Write)을 확인해주세요";
    authStatus.className = "status error";
  }
});

// 초기화
document.getElementById("dateInput") && (document.getElementById("dateInput").value = todayStr());
document.getElementById("endDateInput") && (document.getElementById("endDateInput").value = todayStr());
setFormType("event");
const now = new Date();
viewYear = now.getFullYear();
viewMonth = now.getMonth();
if (token) {
  mainScreen.classList.remove("hidden");
  loadData();
} else {
  authScreen.classList.remove("hidden");
}
</script>
</body>
